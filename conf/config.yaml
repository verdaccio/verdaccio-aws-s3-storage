storage: /verdaccio/storage

plugins: /verdaccio/plugins

# the e2e battery publishes tarballs larger than the 10mb default
max_body_size: 100mb

store:
  aws-s3-storage:
    bucket: AWS_S3_BUCKET
    keyPrefix: AWS_S3_KEY_PREFIX
    region: AWS_DEFAULT_REGION
    endpoint: AWS_S3_ENDPOINT
    s3ForcePathStyle: true
    accessKeyId: AWS_ACCESS_KEY_ID
    secretAccessKey: AWS_SECRET_ACCESS_KEY
    dynamoTableName: AWS_DYNAMO_TABLE_NAME
    dynamoEndpoint: AWS_DYNAMO_ENDPOINT

web:
  enable: true
  login: true

userRateLimit:
  windowMs: 1000
  max: 10000

# no uplink on purpose: the e2e battery only ever uses packages it publishes itself, and
# proxying to npmjs turns every lookup into a network round trip
packages:
  '@*/*':
    access: $all
    publish: $anonymous $authenticated
    unpublish: $anonymous $authenticated
  '**':
    access: $all
    publish: $anonymous $authenticated
    unpublish: $anonymous $authenticated

log:
  - {type: stdout, format: pretty, level: trace}

listen:
  - 0.0.0.0:4873

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
